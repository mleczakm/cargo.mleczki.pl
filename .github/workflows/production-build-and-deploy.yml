name: Production Build and Deploy

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOMAIN: cargo.mleczki.pl

jobs:
  build-and-deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check bank mail deployment secrets
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BANK_MAIL_ADDRESS: ${{ secrets.BANK_MAIL_ADDRESS }}
          BANK_MAIL_WEBHOOK_SECRET: ${{ secrets.BANK_MAIL_WEBHOOK_SECRET }}
          CLOUDFLARE_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          for name in BREVO_API_KEY BANK_MAIL_ADDRESS BANK_MAIL_WEBHOOK_SECRET CLOUDFLARE_WORKER_TOKEN CLOUDFLARE_ZONE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=cargo.mleczki.pl
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_REVISION=${{ github.sha }}

      - name: Checkout infrastructure-mikrus for shared roles
        uses: actions/checkout@v4
        with:
          repository: mleczakm/infrastructure-mikrus
          path: infrastructure-mikrus
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          pip install -r infrastructure-mikrus/requirements.txt
          ansible-galaxy install -r infrastructure-mikrus/ansible-collections-requirements.yml

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create .env file
        run: |
          echo "${{ secrets.DOTENV }}" | grep -vE '^(BREVO_API_KEY|BREVO_SENDER_EMAIL|MAIL_REPLY_TO|IMAP_SERVER|MAILBOX_USERNAME|MAILBOX_PASSWORD|BANK_MAIL_ADDRESS|BANK_MAIL_WEBHOOK_SECRET|BANK_MAIL_FROM|BANK_MAIL_CHECK_FROM)=' > .env.production || true
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env.production
          echo "BREVO_SENDER_EMAIL=noreply@mleczki.pl" >> .env.production
          echo "MAIL_REPLY_TO=do@mleczki.pl" >> .env.production
          echo "BANK_MAIL_ADDRESS=${{ secrets.BANK_MAIL_ADDRESS }}" >> .env.production
          echo "BANK_MAIL_WEBHOOK_SECRET=${{ secrets.BANK_MAIL_WEBHOOK_SECRET }}" >> .env.production
          echo "BANK_MAIL_FROM=${{ vars.BANK_MAIL_FROM || 'powiadomienia@alior.pl' }}" >> .env.production
          echo "BANK_MAIL_CHECK_FROM=${{ vars.BANK_MAIL_CHECK_FROM || '1' }}" >> .env.production
          echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> .env.production
          echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> .env.production
          echo "VAPID_SUBJECT=mailto:admin@cargo.mleczki.pl" >> .env.production
          echo "ENV_FILE_PATH=$(pwd)/.env.production" >> $GITHUB_ENV

      - name: Deploy to Mikrus
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy.yml \
            --extra-vars "app_version=${{ github.ref_name }} cytrus_host=${{ secrets.CYTRUS_IPV4 }}" \
            --extra-vars "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --extra-vars "cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}" \
            --extra-vars "cytrus_api_token=${{ secrets.CYTRUS_API_TOKEN }}" \
            --extra-vars "ansible_host=${{ secrets.MIKRUS_SSH_HOST }} mikrus_ipv6=${{ secrets.MIKRUS_IPV6 }}" \
            --extra-vars "ansible_port=${{ secrets.MIKRUS_SSH_PORT }}" \
            --extra-vars "github_actor=${{ github.actor }} github_token=${{ secrets.GITHUB_TOKEN }}" \
            --extra-vars "env_file_path=${{ env.ENV_FILE_PATH }}" \
            --extra-vars "domain=${{ env.DOMAIN }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_ROLES_PATH: ./ansible/roles:./infrastructure-mikrus/ansible/roles

      - name: Set up Node for bank mail Worker
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy bank mail Worker and routing
        run: |
          npm ci
          node scripts/deploy-bank-mail.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ENV_FILE_PATH: ${{ env.ENV_FILE_PATH }}
