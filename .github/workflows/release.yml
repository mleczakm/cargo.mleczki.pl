name: Release

on:
  workflow_run:
    workflows: ["CI/CD with QA"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

concurrency:
  group: cargo-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify the tested revision is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" = "$TESTED_SHA" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping stale CI run; a newer revision is on main.'
          fi
      - name: Checkout code
        if: steps.current.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: steps.current.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.current.outputs.ready == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract production metadata
        if: steps.current.outputs.ready == 'true'
        id: meta-prod
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Generate version
        if: steps.current.outputs.ready == 'true'
        id: version
        run: |
          export TZ="Europe/Warsaw"
          echo "APP_VERSION=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.current.outputs.ready == 'true'
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.APP_VERSION }}
          commit: ${{ github.event.workflow_run.head_sha }}
          name: "Release ${{ steps.version.outputs.APP_VERSION }}"
          body: "Automated release generated by CI"
          draft: false
          prerelease: false
          token: ${{ secrets.PAT_TOKEN }}
